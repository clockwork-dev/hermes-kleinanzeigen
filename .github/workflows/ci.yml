name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile __init__.py skills/kleinanzeigen/scripts/__init__.py skills/kleinanzeigen/scripts/kleinanzeigen_api.py skills/kleinanzeigen/scripts/search_cli.py skills/kleinanzeigen/scripts/monitor.py tests/test_kleinanzeigen.py

      - name: Run pytest suite
        run: python -m pytest -v

      - name: CLI help smoke checks
        run: |
          python skills/kleinanzeigen/scripts/search_cli.py --help
          python skills/kleinanzeigen/scripts/monitor.py --help
