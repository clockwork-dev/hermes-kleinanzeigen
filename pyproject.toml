[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-kleinanzeigen"
version = "1.0.0"
description = "Hermes Agent plugin and skill for searching and monitoring Kleinanzeigen Germany listings"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "requests>=2.31,<3",
    "beautifulsoup4>=4.12,<5",
    "fake-useragent>=1.4,<3",
]

[project.optional-dependencies]
browser = ["playwright>=1.49,<2"]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = []
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
