manifest_version: 2
name: kleinanzeigen
version: "1.0.0"
description: "Search and monitor Kleinanzeigen Germany classifieds listings by keywords, 5-digit PLZ, radius, and price range with SQLite deduplication and a bundled skill."
kind: standalone
author: "Hermes Kleinanzeigen Contributors"
license: MIT
requires_hermes: ">=0.20.0"
provides_tools:
  - kleinanzeigen_search
  - kleinanzeigen_monitor
pip_dependencies:
  - "requests>=2.31,<3"
  - "beautifulsoup4>=4.12,<5"
  - "fake-useragent>=1.4,<3"
optional_env:
  - name: KLEINANZEIGEN_DB_PATH
    description: "Optional override path for the monitor SQLite seen-ads database"
    password: false
  - name: BROWSER_CDP_URL
    description: "Optional Chromium DevTools CDP URL for browser fetch mode"
    password: false
  - name: BROWSER_DISABLE_RESOURCE_BLOCKING
    description: "Set to 1 to disable Playwright image/media/font/ad-tech request blocking"
    password: false
  - name: BROWSER_EXECUTABLE_PATH
    description: "Optional path to a Chromium/Chrome executable for Playwright browser fallback"
    password: false
